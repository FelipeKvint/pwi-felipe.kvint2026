<!DOCTYPE html>
<html lang="en">

<head>
  <title>CSS Template</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background-color: #000000;
      padding: 30px;
      text-align: center;
      font-size: 35px;
      color: white;
    }

    nav {
      float: left;
      width: 30%;
      height: 300px;
      background: #f0f0f0;
      padding: 20px;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
    }

    article {
      float: left;
      padding: 20px;
      width: 70%;
      background-color: #ffffff;
      height: 300px;
    }

    section::after {
      content: "";
      display: table;
      clear: both;
    }

    footer {
      background-color: #000000;
      padding: 10px;
      text-align: center;
      color: white;
    }

    @media (max-width: 600px) {
      nav,
      article {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>
  <header>
    <h2>Corinthians</h2>
  </header>

  <section>
    <nav>
      <ul>
        <li><a href="HistoriaSiteCorinthians.html" target="conteudo">História</a></li>
        <li><a href="TtiulosSiteCorinthians.html" target="conteudo">Títulos</a></li>
        <li><a href="JogadoresSiteCorinthians.html" target="conteudo">Jogadores</a></li>
      </ul>
    </nav>

    <article>
      <iframe name="conteudo" src="HistoriaSiteCorinthians.html" height="1200" width="100%" frameborder="0"></iframe>
    </article>

  </section>

</body>

</html>
